<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBIL-XML | Panel de Mando SaaS</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        h1 { font-size: 1.5rem; color: #38bdf8; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; margin-top: 20px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        #logConsole { margin-top: 20px; background: #020617; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.85rem; color: #4ade80; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 MOBIL-XML - Panel de Mando</h1>
    
    <label for="url">Enlace del Reel / Publicación:</label>
    <input type="text" id="url" placeholder="https://www.instagram.com/reel/...">

    <label for="mensaje">Comentario a enviar:</label>
    <textarea id="mensaje" rows="3" placeholder="Escribe el comentario deseado..."></textarea>

    <label for="plataforma">Plataforma:</label>
    <select id="plataforma">
        <option value="Instagram">Instagram</option>
        <option value="TikTok">TikTok</option>
    </select>

    <button onclick="enviarOrden()">⚡ LANZAR INTERACCIÓN AUTOMÁTICA</button>

    <div id="logConsole"></div>
</div>

<script>
async function enviarOrden() {
    const url = document.getElementById('url').value;
    const mensaje = document.getElementById('mensaje').value;
    const plataforma = document.getElementById('plataforma').value;
    const consoleDiv = document.getElementById('logConsole');

    if(!url) { alert("Por favor pega el enlace"); return; }

    consoleDiv.style.display = "block";
    consoleDiv.innerHTML = "> Procesando orden en el orquestador SaaS...";

    try {
        const res = await fetch('/api/v1/interact', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ url, mensaje, plataforma })
        });
        const data = await res.json();

        if(data.status === 'success') {
            consoleDiv.innerHTML = `✅ ¡ÉXITO!<br>> Bot Asignado: @${data.bot_utilizado}<br>> Target ID: ${data.target_id}<br>> Estado: Comentario enviado correctamente.`;
        } else {
            consoleDiv.innerHTML = `⚠️ Estado: ${data.status} - ${data.razon || 'Procesado'}`;
        }
    } catch(e) {
        consoleDiv.innerHTML = "❌ Error al conectar con el servidor.";
    }
}
</script>

</body>
</html>
