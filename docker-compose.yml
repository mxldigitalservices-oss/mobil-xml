version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mobil_postgres
    restart: always
    environment:
      POSTGRES_USER: mobil_user
      POSTGRES_PASSWORD: mobil_pass
      POSTGRES_DB: mobil_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: mobil_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
