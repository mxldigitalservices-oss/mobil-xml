version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mobil_postgres
    environment:
      POSTGRES_DB: mobil_db
      POSTGRES_USER: mobil_user
      POSTGRES_PASSWORD: mobil_password
    ports:
      - "5432:5432"
    networks:
      - mobil_net

  redis:
    image: redis:7-alpine
    container_name: mobil_redis
    ports:
      - "6379:6379"
    networks:
      - mobil_net

